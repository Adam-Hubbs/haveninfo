[package]
name = "air_resolver"
version = "0.1.0"
edition = "2024"
publish = false
description = "Column-reference resolver for the Haven Info extension, built on Air's R parser and compiled to WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Air's main as of 2026-11-16: the Pratt parser on mainline biome (no
# released Air version has the latter yet).
air_r_parser = { git = "https://github.com/posit-dev/air", rev = "1fb34aa" }
air_r_syntax = { git = "https://github.com/posit-dev/air", rev = "1fb34aa" }
# Must match the biome revision Air's workspace pins, so the rowan types unify.
biome_rowan = { git = "https://github.com/biomejs/biome", rev = "8c43bc0b620e0db4ec841ae20756acedcead9599" }
js-sys = "0.3"
wasm-bindgen = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
